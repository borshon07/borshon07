name: Auto Update README

on:
  schedule:
    # Runs daily at 00:00 UTC (06:00 in Bangladesh)
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Recent Activity section
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: "docs(readme): update recent activity"

      - name: Update Latest Repos section
        uses: JinoArch/github-recent-repos@master
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
