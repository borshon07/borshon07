name: Update Contribution Graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate profile/contributions.svg
        run: python3 scripts/contrib_graph.py "${{ github.repository_owner }}" profile/contributions.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/contributions.svg
          git diff --staged --quiet || git commit -m "chore: update contribution graph"
          git push
